<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixiv Token Desk</title>
  <link rel="stylesheet" href="page.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <main>
    <header><h1>Pixiv Token Desk</h1></header>
    <section class="account" aria-label="账号"><strong id="account-name">正在检查…</strong><span id="account-id"></span></section>
    <section class="token" aria-labelledby="refresh-label"><div class="label"><h2 id="refresh-label">refresh_token</h2><button class="copy" data-kind="refresh" disabled>复制</button></div><div id="refresh-token" class="token-text" aria-labelledby="refresh-label" tabindex="0">—</div></section>
    <section class="token" aria-labelledby="access-label"><div class="label"><h2 id="access-label">access_token</h2><button class="copy" data-kind="access" disabled>复制</button></div><div id="access-token" class="token-text" aria-labelledby="access-label" tabindex="0">—</div></section>
    <p class="expiry">访问令牌到期：<span id="expires-at">—</span></p>
    <p id="message" role="status" aria-live="polite">正在检查网页登录状态…</p>
    <div class="actions"><button id="login" class="primary" disabled>重新获取</button><button id="refresh" disabled>刷新</button></div>
  </main>
</body>
</html>
